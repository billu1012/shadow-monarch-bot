services:
  - type: worker
    name: shadow-monarch-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python shadow_monarch_bot.py
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.8
