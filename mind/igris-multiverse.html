<title>Igris Shadow Multiverse</title>
<style>
/* Layout: an Agent Factory routing graph (inputs → routers → agents → outputs) drawn on one canvas that tilts
   into 3D per phase, a status bar above it, and four instrument panels below. Single dark look by choice. */
:root {
  --bg: #07060a; --panel: #0d0c12; --line: #24222c; --ink: #ffffff; --ink-2: #c9c6d4; --ink-3: #8a8796;
  --pink: #ff3d8b; --violet: #8b5cf6; --yellow: #ffe14d; --orange: #ff7a3d; --lime: #c6f135; --teal: #3ff0c8; --cyan: #22c3dc; --blue: #4d7cff; --gold: #e3b45e; --red: #ff4d5e;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 14px/1.5 var(--mono); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
[hidden] { display: none !important; }
.app { max-width: 1120px; margin: 0 auto; padding-inline: 12px; padding-block: 10px 20px; display: grid; gap: 8px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
.bar b { color: var(--ink); font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 13px; }
.bar .y { color: var(--yellow); } .bar .p { color: var(--pink); }
.bar .right { margin-left: auto; color: var(--pink); text-transform: none; letter-spacing: 0; font-size: 12px; }
.bar .sim { color: var(--bg); background: var(--ink-3); padding: 1px 6px; border-radius: 3px; font-weight: 700; }
.ctl { display: flex; gap: 6px; }
.ctl button { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink-2); background: rgba(7,6,10,.7); }
.ctl button:hover { color: var(--ink); border-color: var(--ink-3); }
.graph { position: relative; height: min(88vh, 92vw); min-height: 420px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #120e1c 0%, var(--bg) 72%); touch-action: manipulation; }
.graph canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.phase { position: absolute; left: 14%; top: 14px; padding-left: 10px; border-left: 2px solid var(--c, var(--pink)); pointer-events: none; }
.phase b { display: block; font-size: clamp(15px, 2.6vw, 22px); letter-spacing: 0.04em; }
.phase span { color: var(--c, var(--pink)); font-size: 12px; }
.fsx { position: absolute; top: 10px; right: 10px; z-index: 3; }
.dash { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pnl { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; position: relative; min-width: 0; overflow: hidden; }
.pnl h3 { margin: 0 0 4px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; padding-left: 8px; border-left: 2px solid var(--violet); }
.pnl h3 small { color: var(--ink-3); font-weight: 400; letter-spacing: 0; text-transform: none; }
.pnl canvas { width: 100%; display: block; }
.trace { font-size: 10.5px; line-height: 1.5; color: var(--ink-2); height: 96px; overflow: hidden; margin-top: 4px; }
.trace div { display: grid; grid-template-columns: 38px 56px 1fr; gap: 6px; white-space: nowrap; }
.trace div span:first-child { color: var(--ink-3); } .trace div span:nth-child(2) { color: var(--pink); }
.trace div span:last-child { overflow: hidden; text-overflow: ellipsis; }
.code { font-size: 10.5px; line-height: 1.5; height: 112px; overflow: hidden; color: var(--ink-2); white-space: pre; margin-top: 4px; }
.code .k { color: var(--pink); } .code .s { color: var(--yellow); } .code .c { color: var(--ink-3); }
.code .cur { display: inline-block; width: 6px; height: 11px; background: var(--pink); vertical-align: -1px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 11px; color: var(--ink-3); }
.kv b { color: var(--ink); font-weight: 600; text-align: right; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 11px; color: var(--ink-3); }
.foot b { color: var(--ink); }
.tip { position: fixed; z-index: 50; pointer-events: none; background: #15131c; border: 1px solid #3a3646; border-radius: 6px; padding: 8px 10px; font-size: 12px; max-width: 280px; box-shadow: 0 12px 30px rgba(0,0,0,.6); }
.tip span { color: var(--ink-2); display: block; }
.overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; perspective: 1400px; background: rgba(4, 3, 6, 0.74); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.card { width: min(480px, 100%); max-height: 86vh; overflow-y: auto; background: #110f17; border: 1px solid #3a3646; border-top: 3px solid var(--c, var(--violet)); border-radius: 8px; padding: 20px; position: relative; font-size: 14px; line-height: 1.6; }
.card .x { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 6px; background: #1c1924; font-size: 18px; display: grid; place-items: center; }
.card h4 { margin: 0 40px 6px 0; font-size: 18px; }
.card p { margin: 0 0 10px; color: var(--ink-2); }
.card ul { margin: 0; padding-left: 18px; color: var(--ink-2); }
.card .lbl { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 12px; }
.fs .app { max-width: none; padding: 0; }
.fs .graph { position: fixed; inset: 0; z-index: 30; height: auto; border: 0; border-radius: 0; }
@media (max-width: 860px) { .dash { grid-template-columns: repeat(2, minmax(0, 1fr)); } .graph { height: min(118vw, 760px); } .phase { left: 12px; } }
@media (max-width: 420px) { .bar .hide-s { display: none; } }
</style>

<div class="app">
  <div class="bar" id="bar"></div>
  <div class="graph" id="graph">
    <canvas id="cv" aria-label="Agent Factory routing graph. Tap a block for details."></canvas>
    <div class="phase" id="phase"><b>01 IDEA IN</b><span>idea · board · repo · memory</span></div>
    <div class="ctl fsx"><button id="pause" type="button">pause</button><button id="fs" type="button">⛶ full</button></div>
  </div>
  <section class="dash">
    <div class="pnl"><h3>Decision stream <small id="dps">— dec/s</small></h3><canvas id="c1" height="120"></canvas><div class="trace" id="trace"></div></div>
    <div class="pnl"><h3 style="border-color:var(--pink)">Route lanes <small>7 routes</small></h3><canvas id="c2" height="220"></canvas></div>
    <div class="pnl"><h3 style="border-color:var(--teal)">Igris core <small>factory v1</small></h3><canvas id="c3" height="110"></canvas><div class="code" id="code"></div></div>
    <div class="pnl"><h3 style="border-color:var(--lime)">Gate matrix <small>0.85 gate</small></h3><canvas id="c4" height="130"></canvas><div class="kv" id="gkv"></div></div>
  </section>
  <footer class="foot"><span><b>prat</b> · CEO · Agent Factory</span><span>Routing is simulated; the trace replays real Oct 11 runs</span><span>IGRIS SHADOW MULTIVERSE · v2</span></footer>
</div>
<div class="overlay" id="overlay" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<div class="tip" id="tip" hidden></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = getComputedStyle(document.body).fontFamily;
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ---------------- blocks: the factory as a graph (graph space 1080 × 980) ---------------- */
const C = { pink: '#ff3d8b', violet: '#7a4dff', yellow: '#e8d23c', orange: '#ff7a3d', lime: '#b6d730', teal: '#1fae8c', cyan: '#22b5c9', blue: '#3a6df0', olive: '#a99b2f', grey: '#7d8190', green: '#1f7a68' };
const B = [];
function block(id, col, y, name, color, rows, info) { const xs = [20, 555, 735, 910], ws = [128, 158, 152, 150], zs = [0, -60, -120, -180]; B.push({ id, col, x: xs[col], y, w: ws[col], z: zs[col], name, color, rows, info }); }
block('idea', 0, 88, 'idea', C.green, ['the_ask', 'context', 'deadline', 'owner'], 'What comes in: your ask, its context and deadline.');
block('board', 0, 242, 'factory_board', C.green, ['doing', 'done', 'blocked', 'agents', 'standup'], 'The live board: every agent reports doing, done or blocked.');
block('repo', 0, 424, 'repo', C.green, ['branch', 'tests', 'diff', 'ci'], 'The codebase the agents work in.');
block('memory', 0, 575, 'memory', C.olive, ['export', 'drafts', 'lanes', 'guard', 'stale'], 'What I know about you: the Oct 11 memory export, drafts, lanes and the guard.');
block('last', 0, 756, 'last_run', C.green, ['launch_review', 'verdict', 'holds', 'cost'], 'The previous run, so nothing is repeated.');
block('state', 1, 86, 'state · pack', C.pink, ['goal', 'board', 'repo', 'memory', 'cached'], 'Igris packs everything an agent needs into one typed state.');
block('spec', 1, 282, 'spec · typed', C.pink, ['problem', 'users', 'metric', 'non_goals', 'cuts'], 'product-manager: a one-page spec. Problem, users, success metric, non-goals, scope cuts.');
block('rank', 1, 478, 'rank · priority', C.cyan, ['low', 'medium', 'high', 'urgent', 'trend'], 'What goes first. The hackathon outranks everything until Oct 30.');
block('gate', 1, 674, 'gate · 0.85', C.lime, ['passed', 'hold', 'human', 'override'], 'The launch gate: privacy, cost and launch reviews. Any block stops the ship.');
block('reviewq', 1, 870, 'review_q · 6/6', C.yellow, ['required', 'queued', 'typed_json', 'schema', 'retries'], 'code-reviewer: nothing lands without review. Blocking, Should fix, Nit, verdict.');
block('igris', 2, 120, 'igris · decide', C.violet, ['state_tok', 'no_chat', 'confidence', 'options', 'output', 'max_out'], 'Me, the engineering manager: I route each job to the right agents and say who goes next.');
block('build', 2, 317, 'build · write', C.orange, ['frontend', 'backend', 'tests', 'diff', 'words'], 'frontend-engineer and backend-engineer: small diffs, honest failure paths, 400px-ready.');
block('research', 2, 513, 'research', C.orange, ['sources', 'notes', 'prior_art', 'pricing', 'applied'], 'ux-researcher and market-researcher: evidence and sources, never invented.');
block('score', 2, 709, 'score', C.orange, ['privacy', 'cost', 'launch', 'qa', 'verdict'], 'privacy-security-reviewer, cost-controller, launch-manager and qa-engineer score the work.');
block('human', 2, 905, 'prat · review', C.blue, ['budget', 'edits', 'reads', 'approvals'], 'You. Every push, deploy and dollar waits for your approval.');
block('oplan', 3, 96, 'out.plan', C.teal, ['design_doc', 'diffs', 'owner', 'next'], 'tech-lead: the design doc and a plan of small diffs, each with an owner and a test.');
block('ocode', 3, 292, 'out.code', C.teal, ['passed', 'review', 'valid', 'merged'], 'Code that passed review and QA.');
block('overdict', 3, 488, 'out.verdict', C.teal, ['go', 'conditions', 'no_go', 'flaky'], 'launch-manager: Go, Go with conditions, or No go.');
block('drafts', 3, 684, 'drafts/', C.olive, ['readme', 'devpost', 'video', 'release_notes'], 'content-strategist: README, Devpost, demo video script, release notes.');
block('queue', 3, 880, 'queue/', C.grey, ['main.json', 'deploy', 'approved', 'cleared'], 'release-engineer: the ship queue. Deploys wait for you.');
const byId = Object.fromEntries(B.map(b => [b.id, b]));
const HEAD = 14, ROW = 11.5;
B.forEach(b => { b.h = HEAD + b.rows.length * ROW + 4; b.vals = b.rows.map(() => +(rnd() * 1.6).toFixed(3)); b.bars = b.rows.map(() => 0.25 + rnd() * 0.65); });
const port = (b, i, side) => [side ? b.x + b.w : b.x, b.y + HEAD + i * ROW + ROW / 2, b.z];
const RAIL = 307;

const L = [];
function link(a, ai, b, bi, viaRail) { L.push({ a, ai, b, bi, viaRail }); }
const cols = [0, 1, 2, 3].map(c => B.filter(b => b.col === c));
for (const t of cols[1]) t.rows.forEach((_, ti) => { for (let k = 0; k < 9; k++) { const s = cols[0][Math.floor(rnd() * cols[0].length)]; link(s.id, Math.floor(rnd() * s.rows.length), t.id, ti, true); } });
for (const t of cols[2]) t.rows.forEach((_, ti) => { for (let k = 0; k < 4; k++) { const s = cols[1][Math.floor(rnd() * cols[1].length)]; link(s.id, Math.floor(rnd() * s.rows.length), t.id, ti, false); } });
for (const t of cols[3]) t.rows.forEach((_, ti) => { for (let k = 0; k < 3; k++) { const s = cols[2][Math.floor(rnd() * cols[2].length)]; link(s.id, Math.floor(rnd() * s.rows.length), t.id, ti, false); } });
function bez(p0, p1, p2, p3, t) { const u = 1 - t; return p0.map((_, k) => u * u * u * p0[k] + 3 * u * u * t * p1[k] + 3 * u * t * t * p2[k] + t * t * t * p3[k]); }
L.forEach(l => {
  const a = port(byId[l.a], l.ai, 1), b = port(byId[l.b], l.bi, 0), pts = [];
  if (l.viaRail) {
    const ry = a[1] + (b[1] - a[1]) * (0.3 + rnd() * 0.4), r = [RAIL, ry, (a[2] + b[2]) / 2];
    for (let i = 0; i <= 10; i++) pts.push(bez(a, [a[0] + 90, a[1], a[2]], [RAIL - 70, ry, r[2]], r, i / 10));
    for (let i = 1; i <= 14; i++) pts.push(bez(r, [RAIL + 90, ry, r[2]], [b[0] - 120, b[1], b[2]], b, i / 14));
  } else { const dx = (b[0] - a[0]) * 0.55; for (let i = 0; i <= 16; i++) pts.push(bez(a, [a[0] + dx, a[1], a[2]], [b[0] - dx, b[1], b[2]], b, i / 16)); }
  l.pts = pts; l.off = rnd(); l.sp = 0.25 + rnd() * 0.35;
});

/* ---------------- phases ---------------- */
const PH = [
  { n: '01 IDEA IN', sub: 'idea · board · repo · memory', c: '#ff3d8b', from: ['idea', 'board', 'repo', 'memory', 'last'], to: ['state', 'spec'], tag: ['spec · typed', 'product-manager · one page'], yaw: -0.5, pitch: 0.5, roll: -0.28 },
  { n: '02 IGRIS ROUTES', sub: 'typed spec · no prose', c: '#9b7bff', from: ['state', 'spec', 'rank'], to: ['igris', 'oplan'], tag: ['igris · decide', '15 agents · who goes next'], yaw: 0.45, pitch: 0.55, roll: 0.22 },
  { n: '03 AGENTS BUILD', sub: 'only the work that needs code', c: '#ffe14d', from: ['spec', 'state', 'igris'], to: ['build', 'research', 'ocode', 'drafts'], tag: ['build · write', 'small diffs · each with a test'], yaw: -0.4, pitch: 0.6, roll: -0.3 },
  { n: '04 GATE HOLDS', sub: 'privacy · cost · launch · 0.85', c: '#ff6a3d', from: ['build', 'gate', 'reviewq'], to: ['score', 'gate', 'overdict'], tag: ['gate · 0.85', 'any block stops the ship'], yaw: 0.5, pitch: 0.55, roll: 0.25 },
  { n: '05 PRAT REVIEWS', sub: 'you read the diff · you approve', c: '#ffffff', from: ['reviewq', 'score', 'gate'], to: ['human', 'queue'], tag: ['prat · review', 'pushes · deploys · spend'], yaw: 0, pitch: 0, roll: 0, flat: true },
  { n: '06 RELEASE ACTS', sub: 'queue/ main.json · deploy waits on you', c: '#3ff0c8', from: ['human', 'igris', 'build'], to: ['queue', 'ocode', 'drafts', 'overdict'], tag: ['queue/ main.json', 'release-engineer · ships'], yaw: -0.35, pitch: 0.5, roll: -0.2 },
];
const PHASE_T = 7.5;
let phase = 0, pt = 0, paused = false;

/* ---------------- canvas + camera ---------------- */
const gw = $('graph'), cv = $('cv'), g = cv.getContext('2d');
let W = 800, H = 800, PR = 1;
function size() { W = gw.clientWidth; H = gw.clientHeight; PR = Math.min(2, devicePixelRatio || 1); cv.width = Math.round(W * PR); cv.height = Math.round(H * PR); }
size(); new ResizeObserver(size).observe(gw);
const cam = { yaw: 0, pitch: 0, roll: 0, zoom: 1, fx: 540, fy: 490 };
function P(p) {
  const x = p[0] - cam.fx, y = p[1] - cam.fy, z = p[2] + 90;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch), cr = Math.cos(cam.roll), sr = Math.sin(cam.roll);
  const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
  const y1 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
  const x2 = x1 * cr - y1 * sr, y2 = x1 * sr + y1 * cr;
  const D = 1500, s = D / (D + z2), k = Math.min(W / 1080, H / 990) * 0.96 * cam.zoom;
  return [W / 2 + x2 * s * k, H / 2 + y2 * s * k, z2];
}
const sm = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
function camera() {
  const ph = PH[phase], ids = [...ph.to, ph.from[0]];
  const cx = ids.reduce((s, i) => s + byId[i].x + byId[i].w / 2, 0) / ids.length, cyy = ids.reduce((s, i) => s + byId[i].y + byId[i].h / 2, 0) / ids.length;
  const k = (ph.flat || reduce) ? 0 : sm((pt - 2.0) / 1.4) * (1 - sm((pt - (PHASE_T - 1.1)) / 1.1));
  cam.yaw = ph.yaw * k; cam.pitch = ph.pitch * k; cam.roll = ph.roll * k; cam.zoom = 1 + 0.75 * k;
  cam.fx = 540 + (cx - 540) * k; cam.fy = 490 + (cyy - 490) * k;
}

/* ---------------- draw graph ---------------- */
let quads = [];
function drawBlock(b, act) {
  const p00 = P([b.x, b.y, b.z]), p10 = P([b.x + b.w, b.y, b.z]), p01 = P([b.x, b.y + b.h, b.z]), p11 = P([b.x + b.w, b.y + b.h, b.z]);
  quads.push([b, [p00, p10, p11, p01]]);
  g.setTransform(PR * (p10[0] - p00[0]) / b.w, PR * (p10[1] - p00[1]) / b.w, PR * (p01[0] - p00[0]) / b.h, PR * (p01[1] - p00[1]) / b.h, PR * p00[0], PR * p00[1]);
  g.globalAlpha = act ? 1 : 0.62;
  g.fillStyle = 'rgba(10,9,14,0.92)'; g.fillRect(0, 0, b.w, b.h);
  g.strokeStyle = b.color; g.lineWidth = act ? 1.2 : 0.6; g.strokeRect(0, 0, b.w, b.h);
  g.fillStyle = b.color; g.fillRect(0, 0, b.w, HEAD);
  g.fillStyle = '#fff'; g.font = `700 8.5px ${FONT}`; g.textBaseline = 'middle'; g.textAlign = 'left'; g.fillText(b.name, 5, HEAD / 2 + 0.5);
  g.font = `500 6.8px ${FONT}`;
  b.rows.forEach((r, i) => {
    const y = HEAD + i * ROW + 2;
    g.fillStyle = b.color + '55'; g.fillRect(6, y + 1, (b.w - 50) * b.bars[i], ROW - 3);
    g.fillStyle = '#e9e6f2'; g.fillText(r, 9, y + ROW / 2 - 0.5);
    g.textAlign = 'right'; g.fillStyle = '#c9c6d4'; g.fillText(b.vals[i].toFixed(3), b.w - 6, y + ROW / 2 - 0.5); g.textAlign = 'left';
    g.fillStyle = b.color; g.beginPath(); g.arc(0, y + ROW / 2 - 1, 1.6, 0, 6.283); g.arc(b.w, y + ROW / 2 - 1, 1.6, 0, 6.283); g.fill();
  });
  g.globalAlpha = 1; g.setTransform(PR, 0, 0, PR, 0, 0);
}
function sparkle(x, y, r, col, a) {
  g.globalAlpha = a; const gr = g.createRadialGradient(x, y, 0, x, y, r * 3); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r * 3, y - r * 3, r * 6, r * 6);
  g.strokeStyle = '#fff'; g.lineWidth = 1; g.beginPath(); g.moveTo(x - r * 2.2, y); g.lineTo(x + r * 2.2, y); g.moveTo(x, y - r * 2.2); g.lineTo(x, y + r * 2.2); g.stroke(); g.globalAlpha = 1;
}
const BG = Array.from({ length: 140 }, () => [Math.random(), Math.random(), Math.random() * 0.5 + 0.1]);
let T = 0;
function drawGraph() {
  g.setTransform(PR, 0, 0, PR, 0, 0); g.clearRect(0, 0, W, H);
  for (const [x, y, a] of BG) { g.fillStyle = `rgba(255,255,255,${a * (0.6 + 0.4 * Math.sin(T + x * 40))})`; g.fillRect(x * W, y * H, 1.2, 1.2); }
  const ph = PH[phase], fromS = new Set(ph.from), toS = new Set(ph.to);
  g.strokeStyle = 'rgba(255,60,90,0.09)'; g.lineWidth = 1;
  g.beginPath(); for (let i = 0; i < 9; i++) { const a = P([540 + Math.cos(i * 0.7) * 520, 490 + Math.sin(i * 1.3) * 420, -260]), b = P([540 + Math.cos(i * 0.7 + 2.4) * 520, 490 + Math.sin(i * 1.3 + 2) * 420, -260]); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); } g.stroke();
  const r0 = P([RAIL, 60, -30]), r1 = P([RAIL, 960, -30]); g.strokeStyle = 'rgba(63,240,200,0.35)'; g.lineWidth = 2; g.beginPath(); g.moveTo(r0[0], r0[1]); g.lineTo(r1[0], r1[1]); g.stroke();
  const proj = L.map(l => l.pts.map(P));
  g.strokeStyle = 'rgba(220,220,235,0.13)'; g.lineWidth = 0.8; g.beginPath();
  proj.forEach(pp => { g.moveTo(pp[0][0], pp[0][1]); for (let i = 1; i < pp.length; i++) g.lineTo(pp[i][0], pp[i][1]); }); g.stroke();
  const grow = Math.min(1, pt / 1.2);
  g.globalCompositeOperation = 'lighter';
  L.forEach((l, k) => {
    const on = (fromS.has(l.a) && toS.has(l.b)) || (fromS.has(l.a) && fromS.has(l.b)) || (toS.has(l.a) && toS.has(l.b));

/* ---------------- interaction ---------------- */
