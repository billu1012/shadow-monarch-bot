<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Igris Shadow Core</title>
<style>
/* Layout: control room. Desktop = instruments | fiber core | instruments, editor + log below.
   Phone = one column, core first. Every instrument is a button that opens a 3D detail card.
   Shell = Monarch (violet/gold chrome). Charts = Matte validated palette, status colors reserved. */
:root {
  /* surfaces (Matte) */
  --plane: #080808; --surface-1: #121212; --surface-2: #1a1a1a; --surface-3: #222222;
  --border: rgba(255, 255, 255, 0.10); --border-hi: rgba(255, 255, 255, 0.22);
  /* ink */
  --text-primary: #ffffff; --text-secondary: #c9c9c4; --text-muted: #8a8a84;
  --grid: #232323; --axis: #383835;
  /* categorical, fixed slot order */
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
  /* sequential */
  --seq-100: #cde2fb; --seq-200: #9ec5f4; --seq-300: #6da7ec; --seq-400: #3987e5; --seq-500: #256abf; --seq-600: #184f95;
  /* status, reserved */
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  /* Monarch chrome, brand only, never chart data */
  --violet: #9d6bff; --gold: #e3b45e;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--plane); }
body { margin: 0; color: var(--text-primary); font: 17px/1.65 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 13px; font-weight: 560; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-muted); }

.app { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; display: grid; gap: 12px; }

/* header */
.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: clamp(1.4rem, 4vw, 1.9rem); font-weight: 700; letter-spacing: -0.015em; }
.brand i { width: 38px; height: 38px; border-radius: 8px; background: var(--violet); display: grid; place-items: center; font-style: normal; font-size: 20px; color: #0b090d; flex: none; }
.brand span { color: var(--gold); font-weight: 600; }
.clock { display: flex; gap: 16px; align-items: center; font: 600 13px var(--mono); }
.live { color: var(--text-primary); display: inline-flex; align-items: center; gap: 7px; letter-spacing: 0.1em; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--critical); animation: pulse 1.4s infinite; }
.clock small { display: block; color: var(--text-muted); font-weight: 400; }
@keyframes pulse { 50% { opacity: 0.3; } }

/* tappable cards */
.panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; position: relative; min-width: 0; }
.tap { transition: border-color 0.2s, transform 0.25s, box-shadow 0.25s; transform-style: preserve-3d; will-change: transform; }
.tap:hover { border-color: var(--border-hi); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55); }
.tap .more { position: absolute; top: 12px; right: 14px; font: 600 12px var(--mono); color: var(--text-muted); }
.tap:hover .more { color: var(--text-primary); }
.ttl { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-right: 22px; }
.ttl h2 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
.ttl small { font-size: 13px; color: var(--text-muted); }

/* pipeline */
.stages { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.stage { padding: 10px 12px; border-radius: 10px; }
.stage b { display: block; font-size: 15px; }
.stage span { font-size: 13px; color: var(--text-muted); }
.stage em { font-style: normal; font: 600 12px var(--mono); color: var(--text-muted); }
.stage .bar { height: 3px; background: var(--surface-3); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.stage .bar i { display: block; height: 100%; width: 0; background: var(--violet); }
.stage.on { border-color: var(--violet); }
.stage.gate { border-color: rgba(227, 180, 94, 0.45); }
.stage.gate.on { border-color: var(--gold); }
.stage.gate .bar i { background: var(--gold); }

/* main grid */
.main { display: grid; grid-template-columns: 300px minmax(0, 1fr) 280px; gap: 12px; align-items: stretch; }
.col { align-content: start; }
.col { display: grid; gap: 12px; }

/* projects */
.plist { display: grid; gap: 10px; margin-top: 12px; }
.prow { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; margin-inline: -8px; border-radius: 8px; }
.prow:hover { background: var(--surface-2); }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.prow b { font-size: 15px; font-weight: 600; display: block; line-height: 1.25; }
.prow small { font-size: 13px; color: var(--text-muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--mono); padding: 3px 8px; border-radius: 999px; background: var(--surface-3); color: var(--text-primary); white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--text-muted)); }

/* svgs */
svg text { fill: var(--text-secondary); font-family: var(--sans); }
.chart { width: 100%; display: block; margin-top: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--text-secondary); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; }
.bigline { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
.big { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; }

/* core */
.core { display: flex; flex-direction: column; padding: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 55%, #1b1324 0%, var(--plane) 72%); border-color: var(--border); }
.stagewrap { position: relative; flex: 1; min-height: 620px; }
.stagewrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
svg.leads { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.corelabel { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); font: 600 11px var(--mono); letter-spacing: 0.22em; color: rgba(255, 255, 255, 0.4); pointer-events: none; }
.tag { position: absolute; transform: translate(-50%, -50%); background: rgba(8, 8, 8, 0.88); border: 1px solid var(--border-hi); font: 600 12px var(--mono); padding: 4px 9px; border-radius: 6px; white-space: nowrap; transition: opacity 0.2s, background 0.2s; }
.tag:hover { background: var(--surface-3); }
.tag::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c, #fff); margin-right: 7px; vertical-align: 1px; }
.boxes { position: absolute; inset: 0; pointer-events: none; }
.box { position: absolute; pointer-events: auto; width: 200px; background: rgba(8, 8, 8, 0.9); border: 1px solid var(--border-hi); border-radius: 10px; padding: 10px 12px; }
.box b { display: block; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; }
.box span { font-size: 13px; color: var(--text-secondary); }
.box .more { top: 9px; right: 11px; }
.box.a { left: 18px; top: 18px; } .box.b { right: 18px; top: 18px; } .box.c { right: 18px; bottom: 18px; }

/* visions: shown at the deepest point of the dive */
.vision { position: absolute; inset: 0; pointer-events: none; display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center; }
.vision figure { grid-area: 1 / 1; margin: 0; height: 74%; width: 80%; display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; gap: 10px;
  opacity: 0; transform: scale(0.9) translateY(10px); filter: blur(6px);
  transition: opacity 2.8s ease, transform 6s ease, filter 2.8s ease; }
.vision figure.show { opacity: 1; transform: scale(1) translateY(0); filter: blur(0);
  transition: opacity 1.6s ease, transform 6s ease-out, filter 1.6s ease; }
.vision img, .vision video { height: 100%; width: 100%; min-height: 0; border-radius: 12px; object-fit: contain; display: block;
  box-shadow: 0 0 60px rgba(157, 107, 255, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.12);
  -webkit-mask-image: radial-gradient(ellipse 75% 80% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 75% 80% at 50% 50%, #000 62%, transparent 100%); }
.vision figcaption { background: rgba(8, 8, 8, 0.82); padding: 4px 12px; border-radius: 6px; font: 600 13px var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-primary); text-shadow: 0 0 18px rgba(157, 107, 255, 0.9); }
.vision figcaption span { color: var(--gold); }
.vision figure[data-v="council"] { height: 66%; margin-top: 12%; }
.stagewrap.visioning .tag, .stagewrap.visioning .corelabel { opacity: 0.08 !important; pointer-events: none !important; }
.stagewrap.visioning svg.leads { opacity: 0; }
svg.leads { transition: opacity 1s; }
.tag { transition: opacity 0.8s, background 0.2s; }

/* full-screen mode */
.fs-btn { display: inline-flex; align-items: center; gap: 8px; font: 600 13px var(--mono); letter-spacing: 0.06em; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border-hi); }
.fs-btn:hover { background: var(--surface-3); }
.cinema { position: fixed; inset: 0; z-index: 35; background: var(--plane); display: grid; grid-template-columns: 1fr; overflow: clip;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.cin-core { position: relative; min-height: 0; background: radial-gradient(ellipse at 50% 55%, #1b1324 0%, var(--plane) 72%); }
.cin-core .stagewrap { position: absolute; inset: 0; height: auto; min-height: 0; }
.cin-exit { position: absolute; top: 12px; left: 12px; z-index: 3; }
.cin-stage-row { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 3; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; pointer-events: none; }
.cin-stage-row span { font: 600 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; text-align: center; padding: 6px 0; border-radius: 6px; background: rgba(8, 8, 8, 0.8); color: var(--text-muted); border: 1px solid var(--border); }
.cin-stage-row span.on { color: var(--text-primary); border-color: var(--violet); }
.cin-stage-row span.gate.on { border-color: var(--gold); }
.cin-side { position: absolute; top: 0; right: 0; bottom: 0; width: min(440px, 100%); z-index: 4; min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr);
  border-left: 1px solid var(--border-hi); background: rgba(18, 18, 18, 0.96); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transform: translateX(102%); transition: transform 0.45s cubic-bezier(.2,.8,.2,1); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.cinema.drawer .cin-side { transform: none; box-shadow: -30px 0 60px rgba(0, 0, 0, 0.6); }
.cin-drawer-btn { position: absolute; top: 12px; right: 12px; z-index: 5; }
.cinema.drawer .cin-drawer-btn { right: calc(min(440px, 100%) + 12px); }
.core-fs { position: absolute; left: 18px; bottom: 18px; z-index: 2; }
.now { padding: 18px 20px 16px; border-bottom: 1px solid var(--border); }
.now .eyebrow { font-size: 13px; font-weight: 560; letter-spacing: 0.09em; text-transform: uppercase; color: var(--gold); display: flex; justify-content: space-between; }
.now h2 { margin: 6px 0 4px; font-size: 1.6rem; line-height: 1.2; font-weight: 650; letter-spacing: -0.01em; }
.now p { margin: 0 0 10px; color: var(--text-secondary); font-size: 17px; }
.now .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.now .meter { height: 6px; border-radius: 3px; background: var(--surface-3); margin-top: 12px; overflow: hidden; }
.now .meter i { display: block; height: 100%; background: var(--violet); width: 0; transition: width 1s linear; }
.now .next { margin-top: 10px; font-size: 15px; color: var(--text-secondary); }
.now .next b { color: var(--text-primary); }
.cin-tabs { display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.cin-tabs button { font: 600 14px var(--sans); padding: 8px 14px; border-radius: 8px; color: var(--text-muted); }
.cin-tabs button[aria-selected="true"] { background: var(--surface-3); color: var(--text-primary); box-shadow: inset 0 -2px 0 var(--violet); }
.cin-list { position: relative; overflow-y: auto; overscroll-behavior: contain; padding: 6px 8px 24px; margin: 0; list-style: none; }
.q { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 10px; border-radius: 10px; align-items: start; }
.q + .q { border-top: 1px solid var(--border); }
.q time { font: 600 15px var(--mono); color: var(--text-secondary); padding-top: 2px; }
.q b { font-size: 16px; font-weight: 640; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.q b .dot { flex: none; }
.q p { margin: 2px 0 0; font-size: 15px; line-height: 1.5; color: var(--text-secondary); }
.q .xp { font: 600 15px var(--mono); white-space: nowrap; }
.q small { display: block; font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.q.past { opacity: 0.5; }
.q.now { background: rgba(157, 107, 255, 0.12); border: 1px solid rgba(157, 107, 255, 0.45); opacity: 1; }
.q.now + .q, .q + .q.now { border-top-color: transparent; }
.crit { font: 600 11px var(--mono); letter-spacing: 0.06em; padding: 2px 6px; border-radius: 4px; background: var(--surface-3); color: var(--text-primary); }
.grp { font-size: 13px; font-weight: 560; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-muted); padding: 16px 10px 6px; }
.task > .chip { align-self: start; }
.task { display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 4px 12px; padding: 12px 10px; border-top: 1px solid var(--border); }
.task b { font-size: 16px; font-weight: 640; }
.task p { margin: 2px 0 0; font-size: 15px; color: var(--text-secondary); line-height: 1.5; }
@media (orientation: landscape) and (max-height: 560px) {
  .now { padding: 10px 14px 8px; }
  .now h2 { font-size: 1.15rem; margin: 2px 0; }
  .now p { font-size: 15px; margin-bottom: 6px; }
  .now .meter { margin-top: 8px; } .now .next { margin-top: 6px; font-size: 14px; }
  .cin-tabs { padding: 6px 12px; }
  .cin-stage-row span { font-size: 10px; padding: 3px 0; }
}
@media (orientation: portrait) and (max-width: 760px) {
  .cinema .tag { display: none; }
  .cin-side { top: auto; left: 0; width: 100%; height: 64dvh; border-left: 0; border-top: 1px solid var(--border-hi); border-radius: 16px 16px 0 0; transform: translateY(102%); }
  .cinema.drawer .cin-side { box-shadow: 0 -30px 60px rgba(0, 0, 0, 0.6); }
  .cinema.drawer .cin-drawer-btn { right: 12px; }
  .cinema.drawer .cin-core .stagewrap { bottom: 64dvh; transition: bottom 0.45s; }
  .cinema.drawer .cin-stage-row { display: none; }
  .now { padding: 14px 16px 12px; }
  .now h2 { font-size: 1.35rem; }
  .cin-stage-row span { font-size: 10px; padding: 4px 0; }
  .core-fs { left: auto; right: 10px; bottom: auto; top: 10px; }
}

/* factory */
.stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; margin-top: 12px; }
.stack i { display: block; height: 100%; }
.drows { display: grid; gap: 6px; margin-top: 10px; font-size: 14px; }
.drows div { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; }
.drows i { width: 10px; height: 10px; border-radius: 2px; }
.drows span { color: var(--text-secondary); }

/* gauge */
.gate-g { display: grid; justify-items: center; margin-top: 4px; }
.gstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; text-align: center; font-size: 18px; font-weight: 600; }
.gstats div::before { content: attr(data-k); display: block; font-size: 12px; font-weight: 560; color: var(--text-muted); letter-spacing: 0.08em; }

/* build grid */
.hm { display: grid; grid-template-columns: 26px repeat(7, 1fr); gap: 3px; margin-top: 12px; font: 600 11px var(--mono); color: var(--text-muted); }
.hm i { aspect-ratio: 1; border-radius: 3px; display: block; }
.hm span { display: grid; place-items: center; }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 12px 14px; }
.kpi .v { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; display: block; line-height: 1.25; }
.kpi small { font-size: 13px; color: var(--text-muted); }

/* editor + log */
.lower { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 12px; }
.tabs { display: flex; gap: 16px; font: 13px var(--mono); color: var(--text-muted); align-items: center; flex-wrap: wrap; }
.tabs b { color: var(--text-primary); background: var(--surface-2); padding: 4px 10px; border-radius: 6px; font-weight: 600; box-shadow: inset 0 -2px 0 var(--violet); }
.tabs .lv { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.tabs .lv::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--critical); }
.codebox { overflow-x: auto; margin-top: 12px; min-height: 300px; }
pre.code { margin: 0; font: 13.5px/1.7 var(--mono); white-space: pre; color: var(--text-primary); }
pre.code .ln { display: inline-block; width: 30px; color: var(--text-muted); user-select: none; }
pre.code .cl { display: block; background: rgba(157, 107, 255, 0.12); box-shadow: inset 3px 0 0 var(--violet); }
pre.code .c { color: var(--text-muted); }
pre.code .s { color: var(--gold); }
pre.code .k { color: var(--text-primary); font-weight: 700; }
pre.code .caret { display: inline-block; width: 8px; height: 15px; background: #fff; vertical-align: -2px; animation: pulse 1s steps(1) infinite; }
.log { margin-top: 10px; font: 13px/1.5 var(--mono); }
.log div { display: grid; grid-template-columns: 58px 92px 1fr auto; gap: 8px; padding: 4px 6px; border-radius: 6px; align-items: center; }
.log div > span:first-child { color: var(--text-muted); }
.log .who { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.log .who::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.log .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log .r { color: var(--text-secondary); }
.log .new { background: rgba(157, 107, 255, 0.1); }

.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font: 12px var(--mono); color: var(--text-muted); padding-top: 4px; }
.foot b { color: var(--text-primary); }
.progress { height: 2px; background: var(--surface-3); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--violet); }

[hidden] { display: none !important; }
/* tooltip */
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--surface-2); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 8px; padding: 8px 10px; font-size: 14px; line-height: 1.4; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6); max-width: 240px; }
.tip b { display: block; }
.tip span { color: var(--text-secondary); }

/* 3D detail card */
.overlay { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; perspective: 1400px; background: rgba(4, 3, 6, 0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.card { width: min(560px, 100%); max-height: min(86vh, 860px); overflow-y: auto; background: linear-gradient(180deg, #17131c, var(--surface-1) 42%); border: 1px solid var(--border-hi); border-radius: 16px; padding: 24px 24px 22px; box-shadow: 0 40px 90px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(157, 107, 255, 0.18); transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); position: relative; }
.card .x { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-size: 20px; color: var(--text-secondary); background: var(--surface-2); }
.card .x:hover { color: #fff; }
.card .eyebrow { font-size: 13px; font-weight: 560; letter-spacing: 0.09em; text-transform: uppercase; color: var(--gold); transform: translateZ(30px); }
.card h3 { margin: 4px 44px 10px 0; font-size: 1.6rem; line-height: 1.2; font-weight: 640; letter-spacing: -0.015em; transform: translateZ(50px); text-wrap: balance; }
.card .lede { color: var(--text-secondary); margin: 0 0 16px; transform: translateZ(24px); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; transform: translateZ(40px); }
.metric { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.metric b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.metric span { font-size: 13px; color: var(--text-muted); }
.card .viz { transform: translateZ(28px); margin-bottom: 14px; }
.card h4 { margin: 16px 0 6px; font-size: 13px; font-weight: 560; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-muted); }

    <div class="row"><span class="chip" style="--c:${CAT[q[6]]}">${q[6]}</span><span class="chip" style="--c:var(--gold)">${q[5]} XP</span>${q[7] ? '<span class="crit">CRITICAL</span>' : ''}
    <span class="chip" style="--c:${live ? 'var(--good)' : 'var(--text-muted)'}">${live ? fmtDur(Math.ceil(close - nm)) + ' left' : 'window closed'}</span></div>
    <div class="meter"><i style="width:${pct.toFixed(1)}%"></i></div>
    ${nx ? `<div class="next">Next: <b>${nx[3]} ${esc(nx[2])}</b> at ${nx[0]}, in ${fmtDur(Math.ceil(mins(nx[0]) - nm))}</div>` : '<div class="next">That was the last quest. <b>SHADOW SLEEP</b> wins tomorrow’s boot.</div>'}`;
}
function renderList(scroll) {
  const L = $('cinList');
  if (tab === 'q') {
    const { cur } = questState();
    L.innerHTML = `<li class="grp" style="text-transform:none;letter-spacing:0;font-weight:400;font-size:14px;line-height:1.5">March schedule from your Shadow Monarch app. Since then: sleep target 23:30, gym in the evening (closes 20:00), office Mon/Wed/Fri. Verify the times.</li>` + QD.map((q, i) => `<li class="q ${i < cur ? 'past' : i === cur ? 'now' : ''}" id="q${i}"><time>${q[0]}</time>
      <div><b><span class="dot" style="background:${CAT[q[6]]}"></span>${q[3]} ${esc(q[2])}${q[7] ? '<span class="crit">CRITICAL</span>' : ''}</b><p>${esc(q[4])}</p><small>${q[6]} · until ${q[1]}${i < cur ? ' · past' : i === cur ? ' · now' : ''}</small></div>
      <span class="xp">+${q[5]}</span></li>`).join('');
    if (scroll && cur >= 0) { const el = $('q' + cur); L.scrollTop = Math.max(0, el.offsetTop - L.clientHeight / 2 + el.offsetHeight / 2); }
  } else {
    L.innerHTML = TASKS.map(([g, items]) => `<li class="grp">${esc(g)}</li>` + items.map(([t, d, [st, c]]) => `<li class="task"><div><b>${esc(t)}</b><p>${esc(d)}</p></div><span class="chip" style="--c:${c}">${st}</span></li>`).join('')).join('');
    if (scroll) L.scrollTop = 0;
  }
}
function setTab(t) { tab = t; $('tabQ').setAttribute('aria-selected', t === 'q'); $('tabT').setAttribute('aria-selected', t === 't'); renderList(true); }
$('tabQ').addEventListener('click', () => setTab('q'));
$('tabT').addEventListener('click', () => setTab('t'));
$('cinStages').innerHTML = STAGES.map((s, i) => `<span id="cs${i}" class="${s.gate ? 'gate' : ''}">${s.n}</span>`).join('');
function openCinema() {
  cinema.hidden = false;
  setDrawer(false);
  cinCore.insertBefore(wrap, cinCore.firstChild);
  document.body.style.overflow = 'hidden';
  cinema.scrollTop = cinema.scrollLeft = 0;
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
}
function closeCinema() {
  if (cinema.hidden) return;
  cinema.hidden = true;
  coreHome.insertBefore(wrap, coreHome.firstChild);
  document.body.style.overflow = '';
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
}
$('fsOpen').addEventListener('click', openCinema);
$('coreFs').addEventListener('click', e => { e.stopPropagation(); openCinema(); });
function setDrawer(open) {
  cinema.classList.toggle('drawer', open);
  $('drawerBtn').setAttribute('aria-expanded', open);
  $('drawerBtn').textContent = open ? '✕ Close' : '☰ Quests & tasks';
  if (open) { lastNowKey = ''; renderNow(); renderList(true); }
}
$('drawerBtn').addEventListener('click', () => setDrawer(!cinema.classList.contains('drawer')));
$('fsClose').addEventListener('click', closeCinema);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.hidden) { if (cinema.classList.contains('drawer')) setDrawer(false); else closeCinema(); } });
setInterval(() => { if (!cinema.hidden && cinema.classList.contains('drawer')) { renderNow(); if (tab === 'q') { const { cur } = questState(); const nowEl = document.querySelector('.q.now'); if (!nowEl || nowEl.id !== 'q' + cur) renderList(false); } } }, 1000);

/* ---------------- visions ----------------
   At the deepest point of the dive the timeline holds. After DELAY seconds the first vision rises in,
   stays, then fades slowly while the next one appears. When the last has faded the dive continues. */
// Igris at the first dive into the core, Prat at the Gate, all three of us after Ready.
const IN = 1.6, STAY = 3.2, OUT = 2.8;
const EVENTS = [
  { at: 17.6, v: 'igris', delay: 3 },
  { at: 24.2, v: 'monarch', delay: 3.2 },
  { at: 35.9, v: 'council', delay: 3.2 },
];
const visionWrap = $('vision');
let hold = null; const fired = new Set();
function visions(rt) {
  const f = visionWrap.querySelector(`[data-v="${hold.v}"]`), e = rt - hold.start - hold.delay;
  const on = e >= 0 && e < IN + STAY;
  if (f && on !== f.classList.contains('show')) {
    f.classList.toggle('show', on);
    const v = f.querySelector('video');
    if (v) { if (on) { v.currentTime = 0; v.play().catch(() => {}); } else setTimeout(() => v.pause(), OUT * 1000); }
  }
  if (flare && hold.v === 'council' && !flare.end && e > IN + STAY) flare.end = rt;
  if (e > IN + STAY + OUT * 0.7) { hold = null; wrap.classList.remove('visioning'); }
}

/* ---------------- loop ---------------- */
const T0 = performance.now();
let lastLog = 0, lastClock = 0, stageOn = -1, tl = 0, lastNow = null;
const stageBars = STAGES.map((_, i) => $('st' + i).querySelector('.bar i'));
function frame(now) {
  requestAnimationFrame(frame);
  const dt = lastNow === null ? 0 : Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  const rt = Math.max(0, (now - T0) / 1000);
  if (!hold) tl += dt;
  const p = tl % LOOP, loopN = Math.floor(tl / LOOP);
  if (!hold) for (const ev of EVENTS) {
    const id = loopN + ':' + ev.v;
    if (p >= ev.at && p < ev.at + 1 && !fired.has(id)) {
      fired.add(id); hold = { start: rt, v: ev.v, delay: ev.delay }; wrap.classList.add('visioning');
      if (ev.v === 'monarch') comet = { t0: rt, dur: 1.6 };
      if (ev.v === 'council') flare = { t0: rt, end: 0 };
      break;
    }
  }
  if (hold) visions(rt);
  const diveGo = hold && !(hold.v === 'monarch' && rt - hold.start < 1.5);
  holdDive += ((diveGo ? 1 : 0) - holdDive) * Math.min(1, dt * (hold && hold.v === 'monarch' ? 2.2 : 1.3));
  camera(tl, rt);
  if (!overlay.hidden && smallQ.matches && cinema.hidden) return; // a card fills the phone: pause the core to save battery
  drawTorus(rt); placeTags();
  const scene = Math.min(2, Math.floor(p / 12)), sp = (p % 12) / 12;
  renderCode(scene, Math.floor(Math.min(1, sp / 0.82) * FILES[scene][1].length));
  const st = Math.min(5, Math.floor(p / 6));
  if (st !== stageOn) { STAGES.forEach((_, i) => { $('st' + i).classList.toggle('on', i === st); $('cs' + i).classList.toggle('on', i === st); }); stageOn = st; }
  stageBars.forEach((b, i) => { b.style.width = (i < st ? 100 : i === st ? (p % 6) / 6 * 100 : 0) + '%'; });
  $('prog').style.width = (p / LOOP * 100).toFixed(1) + '%';
  if (now - lastLog > 1400) { lastLog = now; pushLog(); }
  if (now - lastClock > 1000) { lastClock = now; const d = new Date(); $('time').textContent = d.toTimeString().slice(0, 8); $('date').textContent = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase(); }
}
for (let i = 0; i < 11; i++) pushLog();
requestAnimationFrame(frame);
})();
</script>
