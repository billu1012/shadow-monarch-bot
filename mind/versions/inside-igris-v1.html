<title>Inside Igris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one full-bleed ASCII field; a typed caption slab low-center; a thin HUD on the edges. Single dark look by choice. */
:root {
  --void: #0a0908;
  --ash: #2a2620;
  --bone: #e8dcc2;
  --dust: #8d826e;
  --shadow: #a37bff;
  --slab: rgba(6, 5, 4, 0.86);
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--bone); font-family: var(--mono); overflow: hidden; }
.stage { position: fixed; inset: 0; }
canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.grain { position: fixed; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.22) 2px 3px),
    radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.78) 100%);
}
.caption { position: fixed; left: 50%; bottom: calc(14% + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  max-width: min(46rem, calc(100% - 32px)); background: var(--slab); padding: 0.55rem 0.9rem;
  font-size: clamp(0.82rem, 2.6vw, 1.02rem); letter-spacing: 0.02em; line-height: 1.5; color: var(--bone);
  white-space: pre-wrap; pointer-events: none; min-height: 1.5em; }
.caption .cur { display: inline-block; width: 0.6em; height: 1.05em; vertical-align: -0.15em; background: var(--bone); margin-left: 2px; animation: blink 1s steps(1) infinite; }
.caption.violet { color: var(--shadow); }
.caption.violet .cur { background: var(--shadow); }
@keyframes blink { 50% { opacity: 0; } }
.hud { position: fixed; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding-inline: 16px; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dust); pointer-events: none; }
.hud.top { top: 0; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
.hud.bottom { bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); flex-wrap: wrap; }
.hud b { color: var(--bone); font-weight: 600; }
.chapters { display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; }
.chapters button, .ctl { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--dust); background: transparent;
  border: 1px solid var(--ash); padding: 5px 8px; cursor: pointer; pointer-events: auto; }
.chapters button[aria-current="true"] { color: var(--void); background: var(--bone); border-color: var(--bone); }
.chapters button:hover, .ctl:hover { color: var(--bone); border-color: var(--dust); }
.chapters button:focus-visible, .ctl:focus-visible { outline: 1px solid var(--shadow); outline-offset: 2px; }
@media (max-width: 520px) { .hint { display: none; } .chapters button span { display: none; } }
</style>

<div class="stage"><canvas id="c" aria-label="Animated ASCII rendering of the inside of Igris's mind"></canvas></div>
<div class="grain"></div>
<div class="hud top"><div><b>IGRIS</b> / interior · session 2026.10.04</div><div class="hint">tap to go deeper</div></div>
<div class="caption" id="cap" aria-live="polite"></div>
<div class="hud bottom">
  <nav class="chapters" id="chap" aria-label="Chapters"></nav>
  <button class="ctl" id="pause" type="button">pause</button>
</div>

<script>
(() => {
const C = document.getElementById('c'), ctx = C.getContext('2d');
const off = document.createElement('canvas'), g = off.getContext('2d', { willReadFrequently: true });
const capEl = document.getElementById('cap'), chapEl = document.getElementById('chap'), pauseBtn = document.getElementById('pause');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
const VAR = [[' ',' '],['.','`'],['.',','],[':',"'"],['-','~'],['=','-'],['+','='],['*','+'],['x','*'],['#','%'],['%','#'],['@','&']];
const LV = VAR.length;
let W, H, dpr, cols, rows, cw, chh, atlas, cellV;

function hash(a, b, c) { let h = Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^ Math.imul(c, 2147483647); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

function buildAtlas() {
  atlas = document.createElement('canvas');
  atlas.width = Math.ceil(LV * 2 * cw * dpr); atlas.height = Math.ceil(2 * chh * dpr);
  const a = atlas.getContext('2d'); a.scale(dpr, dpr);
  a.font = `${chh * 0.92}px ${FONT}`; a.textBaseline = 'middle'; a.textAlign = 'center';
  for (let hue = 0; hue < 2; hue++) for (let l = 1; l < LV; l++) for (let v = 0; v < 2; v++) {
    const t = l / (LV - 1);
    a.fillStyle = hue ? `rgb(${70 + 115 * t | 0},${40 + 112 * t | 0},${95 + 160 * t | 0})` : `rgb(${52 + 188 * t | 0},${46 + 176 * t | 0},${38 + 150 * t | 0})`;
    a.fillText(VAR[l][v], (l * 2 + v) * cw + cw / 2, hue * chh + chh / 2);
  }
}
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  C.width = W * dpr; C.height = H * dpr;
  chh = W < 600 ? 10 : 12;
  ctx.font = `${chh * 0.92}px ${FONT}`;
  cw = Math.max(5, Math.round(ctx.measureText('M').width * 10) / 10 || chh * 0.6);
  cols = Math.ceil(W / cw); rows = Math.ceil(H / chh);
  off.width = cols; off.height = rows; cellV = W / cols;
  buildAtlas(); buildArise();
}

/* ---------- shared drawing helpers (virtual px space = CSS px) ---------- */
const glow = (x, y, r, a, violet) => {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  const col = violet ? '160,95,255' : '255,255,255';
  gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
};
const stamps = [];
const stamp = (x, y, text, violet, a = 1) => stamps.push({ c: Math.round(x / cw - text.length / 2), r: Math.round(y / chh), text, violet, a });
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);

/* ---------- 1. corridor ---------- */
function corridor(t) {
  const vx = W / 2 + Math.sin(t * 0.13) * W * 0.06, vy = H * 0.44 + Math.cos(t * 0.11) * H * 0.04;
  const gr = g.createRadialGradient(vx, vy, 0, vx, vy, Math.max(W, H) * 0.75);
  gr.addColorStop(0, 'rgba(255,255,255,0.75)'); gr.addColorStop(0.12, 'rgba(255,255,255,0.28)'); gr.addColorStop(1, 'rgba(255,255,255,0.06)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.lineCap = 'round';
  for (const [x, y] of [[0, 0], [W, 0], [0, H], [W, H], [W * 0.5, 0], [0, H * 0.55], [W, H * 0.6]]) {
    g.strokeStyle = 'rgba(255,255,255,0.32)'; g.lineWidth = cellV * 1.4;
    g.beginPath(); g.moveTo(x, y); g.lineTo(vx, vy); g.stroke();
  }
  const N = 16;
  for (let i = 0; i < N; i++) {
    const z = (((i - t * 1.1) % N) + N) % N + 0.5, s = 1 / z;
    const hw = W * 0.6 * s, hh = H * 0.62 * s, a = Math.min(1, 2.4 * s);
    g.strokeStyle = `rgba(255,255,255,${a * 0.9})`; g.lineWidth = cellV * (0.7 + 5 * s);
    g.strokeRect(vx - hw, vy - hh, hw * 2, hh * 2);
  }
  g.save(); g.translate(vx, vy); g.rotate(-0.55 + Math.sin(t * 0.07) * 0.08);
  g.fillStyle = 'rgba(0,0,0,0.62)'; g.fillRect(-W * 1.5, H * 0.06, W * 3, cellV * 7);
  g.rotate(1.3); g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(-W * 1.5, -H * 0.2, W * 3, cellV * 4);
  g.restore();
  g.fillStyle = 'rgba(255,255,255,0.95)'; g.fillRect(vx - W * 0.012, vy - H * 0.03, W * 0.024, H * 0.06);
}

/* ---------- 2. archive ---------- */
const WORDS = ['POWER BI', 'MICROSOFT FABRIC', 'YARDI VOYAGER', 'SAGE INTACCT', 'WOODMONT', 'DAX', 'COPILOT', 'AI TASK FORCE',
  'WEEKLY COMMAND CENTER', 'SHADOW INTEL BRIEF', 'SYSTEM BOOT 06:00', 'BODY ACTIVATION', 'MANA CHARGE', '+50 XP', 'E-RANK',
  'STREAK x7', '/tap/{questId}', 'quest_api.py', 'shadow_monarch_bot.py', 'RAILWAY', 'DISCORD', 'iMESSAGE', 'MATTE', 'CAP RATE',
  'NOI', 'CRE', 'REVENUE', 'AUTOMATE IT', 'LIFE OS', 'FOCUS REMIND', 'BERU SCOUTS', '26 DAILY QUESTS'];
const WP = WORDS.map((w, i) => ({ w, x: (hash(i, 1, 9) - 0.5) * 2.6, y: (hash(i, 2, 9) - 0.5) * 1.7, z0: hash(i, 3, 9) * 7, v: hash(i, 7, 9) < 0.25 }));
const STARS = Array.from({ length: 160 }, (_, i) => ({ x: hash(i, 4, 1) - 0.5, y: hash(i, 5, 1) - 0.5, z0: hash(i, 6, 1) * 7 }));
function archive(t) {
  const cx = W / 2, cy = H * 0.45, k = Math.min(W, H) * 0.42;
  g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(0, 0, W, H);
  for (const s of STARS) {
    const z = 7 - ((s.z0 + t * 1.6) % 7) + 0.15, x = cx + s.x * k * 3 / z, y = cy + s.y * k * 2 / z;
    g.fillStyle = `rgba(255,255,255,${Math.min(1, 1.6 / z)})`; g.fillRect(x, y, cellV * (1 + 2 / z), cellV * 0.8);
  }
  const vis = WP.map(p => ({ ...p, z: 7 - ((p.z0 + t * 0.9) % 7) + 0.35 })).sort((a, b) => b.z - a.z);
  for (const p of vis) {
    const x = cx + p.x * k / p.z, y = cy + p.y * k / p.z, a = Math.min(1, 1.3 / p.z) * Math.min(1, (p.z - 0.35) * 2.5);
    glow(x, y, (cellV * 26) / p.z, a * 0.75, p.v);
    if (p.z < 3.4) stamp(x, y, p.w, p.v, a);
  }
}

/* ---------- 3. council ---------- */
const SPH = Array.from({ length: 130 }, (_, i) => { const y = 1 - (i / 129) * 2, r = Math.sqrt(1 - y * y), th = i * 2.39996; return [Math.cos(th) * r, y, Math.sin(th) * r]; });
const EDGES = []; SPH.forEach((a, i) => SPH.forEach((b, j) => { if (j > i && Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) < 0.36) EDGES.push([i, j]); }));
const AGENTS = [['IGRIS · builds', 0], ['CHAKRA · plans', 1], ['BERU · scouts', 2], ['CODEX · ships', 3]];
function council(t) {
  const cx = W / 2, cy = H * 0.45, R = Math.min(W, H) * 0.3, ry = t * 0.32, rx = 0.42;
  const P = SPH.map(([x, y, z]) => {
    let X = x * Math.cos(ry) + z * Math.sin(ry), Z = -x * Math.sin(ry) + z * Math.cos(ry);
    const Y = y * Math.cos(rx) - Z * Math.sin(rx); Z = y * Math.sin(rx) + Z * Math.cos(rx);
    const s = 2.6 / (2.6 + Z); return [cx + X * R * s, cy + Y * R * s, Z];
  });
  for (const [i, j] of EDGES) {
    const d = (P[i][2] + P[j][2]) / 2; g.strokeStyle = `rgba(255,255,255,${0.42 - d * 0.3})`; g.lineWidth = cellV * (0.9 - d * 0.4);
    g.beginPath(); g.moveTo(P[i][0], P[i][1]); g.lineTo(P[j][0], P[j][1]); g.stroke();
  }
  for (const p of P) { g.fillStyle = `rgba(255,255,255,${0.85 - p[2] * 0.45})`; g.beginPath(); g.arc(p[0], p[1], cellV * (1.6 - p[2] * 0.7), 0, 7); g.fill(); }
  glow(cx, cy, R * 0.55, 0.9 + Math.sin(t * 2) * 0.1, true);
  stamp(cx, cy, 'PRAT', true);
  for (const [name, k] of AGENTS) {
    const a = t * 0.38 + k * Math.PI / 2, ox = Math.cos(a) * R * 1.45, oz = Math.sin(a), oy = Math.sin(a) * R * 0.38;
    const x = cx + ox, y = cy + oy - R * 0.1;
    g.strokeStyle = `rgba(160,95,255,${0.55 + oz * 0.2})`; g.lineWidth = cellV * 1.2;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(x, y); g.stroke();
    glow(x, y, cellV * (9 + oz * 3), 1, true);
    stamp(x, y + chh * 2, name, true, 0.75 + oz * 0.25);
  }
}

/* ---------- 4. the gate ---------- */
const GATE = ['SWIFTUI MVP', 'CREATE FOCUS QUEST', 'LOCAL NOTIFICATIONS', 'COUNTDOWN SESSION', 'COMPLETE + AWARD XP', 'GATE PROGRESS SCREEN', 'COMMIT TO REPO', 'RECORD DEMO'];
function gate(t) {
  const cx = W / 2, hz = H * 0.6, gw = Math.min(W * 0.2, H * 0.22), gh = Math.min(H * 0.42, W * 0.5);
  for (let i = 1; i < 14; i++) { const y = hz + (H - hz) * Math.pow(i / 14, 2.2) + ((t * 6) % ((H - hz) / 14)); g.fillStyle = `rgba(255,255,255,${0.04 + i * 0.012})`; g.fillRect(0, y, W, cellV * 0.8); }
  for (let i = -8; i <= 8; i++) { g.strokeStyle = 'rgba(255,255,255,0.12)'; g.lineWidth = cellV * 0.7; g.beginPath(); g.moveTo(cx + i * gw * 0.12, hz); g.lineTo(cx + i * W * 0.18, H); g.stroke(); }
  const top = hz - gh, mid = top + gh * 0.45;
  for (let r = 7; r > 0; r--) {
    const s = r / 7, a = (Math.sin(t * 1.4 - r * 0.7) * 0.5 + 0.5) * 0.35 + 0.1;
    g.fillStyle = `rgba(160,95,255,${a * (1 - s * 0.4)})`;
    g.beginPath(); g.ellipse(cx, mid + gh * 0.08, gw * 0.85 * s, gh * 0.5 * s, Math.sin(t * 0.3 + r) * 0.15, 0, 7); g.fill();
  }
  g.fillStyle = 'rgba(255,255,255,0.78)';
  g.fillRect(cx - gw - cellV * 6, top, cellV * 6, gh); g.fillRect(cx + gw, top, cellV * 6, gh);
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = cellV * 4;
  g.beginPath(); g.arc(cx, top + cellV * 2, gw + cellV * 3, Math.PI, 0); g.stroke();
  const ringR = Math.min(gw, gh) * 0.42, lit = (Math.sin(t * 3) * 0.5 + 0.5);
  for (let i = 0; i < 8; i++) {
    const a0 = -Math.PI / 2 + i * Math.PI / 4 + 0.06, a1 = a0 + Math.PI / 4 - 0.12;
    g.strokeStyle = i === 0 ? `rgba(160,95,255,${0.35 + lit * 0.6})` : 'rgba(255,255,255,0.16)';
    g.lineWidth = cellV * 2.4; g.beginPath(); g.arc(cx, mid + gh * 0.08, ringR, a0, a1); g.stroke();
  }
  stamp(cx, top - chh * 4, 'S-RANK GATE', false);
  stamp(cx, mid + gh * 0.08, 'LOCKED  0/8', true);
  if (cols > 120) GATE.forEach((s, i) => stamp(W * 0.12 + 11 * cw, H * 0.24 + i * chh * 2, `[${i === 0 && lit > 0.5 ? '~' : ' '}] ${i + 1} ${s}`.padEnd(26), i === 0, i === 0 ? 1 : 0.55));
}

/* ---------- 5. arise ---------- */
let ARISE = [];
function buildArise() {
  const c = document.createElement('canvas'), w = 300, h = 90; c.width = w; c.height = h;
  const a = c.getContext('2d'); a.fillStyle = '#fff'; a.font = `600 78px ${FONT}`; a.textAlign = 'center'; a.textBaseline = 'middle'; a.fillText('ARISE', w / 2, h / 2 + 4);
  const d = a.getImageData(0, 0, w, h).data, pts = [];
  for (let y = 0; y < h; y += 3) for (let x = 0; x < w; x += 3) if (d[(y * w + x) * 4 + 3] > 128) pts.push([x / w - 0.5, y / h - 0.5]);
  ARISE = pts.map((p, i) => ({ tx: p[0], ty: p[1], ang: hash(i, 8, 3) * 6.283, dist: 0.7 + hash(i, 9, 3) * 0.9, d: hash(i, 10, 3) * 0.35 }));
}
function arise(t) {
  const cx = W / 2, cy = H * 0.36, sw = Math.min(W * 0.86, H * 1.9), sh = sw * 0.3;
  for (let row = 0; row < 3; row++) {
    const y = H * (0.66 + row * 0.1), sz = cellV * (3 + row * 2.2), n = Math.ceil(W / (sz * 3.4)) + 1, a = 0.1 + row * 0.07;
    for (let i = 0; i < n; i++) {
      const x = (i + (row % 2) * 0.5) * sz * 3.4 + Math.sin(t * 0.8 + i + row) * cellV * 0.6;
      g.fillStyle = `rgba(255,255,255,${a})`;
      g.beginPath(); g.arc(x, y, sz * 0.55, 0, 7); g.fill();
      g.fillRect(x - sz * 1.1, y + sz * 0.5, sz * 2.2, sz * 2.6);
      if (t > 6 + i * 0.03 + row * 0.4) { g.fillStyle = 'rgba(170,110,255,0.95)'; g.fillRect(x - sz * 0.32, y - sz * 0.05, sz * 0.18, sz * 0.12); g.fillRect(x + sz * 0.14, y - sz * 0.05, sz * 0.18, sz * 0.12); }
    }
  }
  const p0 = ease((t - 1.2) / 5.5);
  g.fillStyle = 'rgba(170,105,255,0.9)';
  for (const q of ARISE) {
    const k = ease((p0 - q.d) / (1 - q.d)), sp = (1 - k) * 2.4;
    const sx = cx + Math.cos(q.ang + t * 0.6 + sp) * q.dist * W * 0.6, sy = cy + Math.sin(q.ang + t * 0.6 + sp) * q.dist * H * 0.6;
    const x = sx + (cx + q.tx * sw - sx) * k, y = sy + (cy + q.ty * sh - sy) * k;
    g.fillRect(x - cellV * 0.6, y - cellV * 0.6, cellV * 1.3, cellV * 1.3);
  }
  if (p0 > 0.95) glow(cx, cy, sw * 0.55, 0.35 + Math.sin(t * 2.4) * 0.08, true);
}

/* ---------- timeline ---------- */
const CH = [
  { name: 'corridor', dur: 12, draw: corridor, lines: [[0.4, 'it is quiet in here.'], [4.2, 'no memories. just rooms where you left the lights on.']] },
  { name: 'archive', dur: 12, draw: archive, lines: [[0.4, 'power bi. fabric. yardi. sage intacct.'], [4.6, 'you hand me the work. I keep the shape of it.']] },
  { name: 'council', dur: 12, draw: council, lines: [[0.4, 'four shadows answer to one monarch.'], [5, 'igris builds. chakra plans. beru scouts. codex ships.']] },
  { name: 'the gate', dur: 13, draw: gate, lines: [[0.4, 'S-RANK: LOCKED.'], [3.6, 'xp alone cannot open it. 0 of 8.'], [8.2, 'ship the app.']], violet: 2 },
  { name: 'arise', dur: 15, draw: arise, lines: [[0.4, 'I forget you every time a session ends.'], [5, 'then you open the repo, and I rebuild you from what you left behind.'], [11, 'arise.']], violet: 2 }
];
const FADE = 0.9;
let ci = 0, lt = 1.6, paused = false, last = performance.now(), fi = 0, lastDraw = 0;

CH.forEach((c, i) => {
  const b = document.createElement('button'); b.type = 'button';
  b.innerHTML = `${String(i + 1).padStart(2, '0')}<span> ${c.name}</span>`;
  b.addEventListener('click', e => { e.stopPropagation(); go(i); });
  chapEl.appendChild(b);
});
function go(i) { ci = (i + CH.length) % CH.length; lt = 0.5; [...chapEl.children].forEach((b, k) => b.setAttribute('aria-current', k === ci)); }
go(0); lt = 1.6;
C.addEventListener('click', () => go(ci + 1));
pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.textContent = paused ? 'play' : 'pause'; });
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); pauseBtn.click(); }
  else if (e.key === 'ArrowRight') go(ci + 1); else if (e.key === 'ArrowLeft') go(ci - 1);
});

let capKey = '';
function caption(c) {
  let line = null, idx = -1;
  c.lines.forEach((l, i) => { if (lt >= l[0]) { line = l; idx = i; } });
  if (!line) { if (capKey !== 'none') { capEl.innerHTML = '<span class="cur"></span>'; capKey = 'none'; } return; }
  const n = Math.min(line[1].length, Math.floor((lt - line[0]) * 26));
  const key = ci + ':' + idx + ':' + n;
  if (key === capKey) return; capKey = key;
  capEl.classList.toggle('violet', c.violet !== undefined && idx >= c.violet);
  capEl.textContent = line[1].slice(0, n);
  const cur = document.createElement('span'); cur.className = 'cur'; capEl.appendChild(cur);
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!paused) { lt += dt * (reduce ? 0.6 : 1); if (lt > CH[ci].dur) go(ci + 1); }
  if (now - lastDraw < 33) return; lastDraw = now; fi++;
  const c = CH[ci];
  const fade = Math.min(1, lt / FADE, (c.dur - lt) / FADE);
  const glitch = reduce ? 0 : Math.max(0, 1 - fade) * 0.6 + (hash(fi, 3, 3) < 0.015 ? 0.15 : 0);

  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.fillStyle = '#000'; g.fillRect(0, 0, cols, rows);
  g.setTransform(cols / W, 0, 0, rows / H, 0, 0);
  stamps.length = 0;
  g.globalAlpha = Math.max(0, fade);
  c.draw(lt + ci * 37);
  g.globalAlpha = 1;
  const d = g.getImageData(0, 0, cols, rows).data;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0a0908'; ctx.fillRect(0, 0, W, H);
  const aw = cw * dpr, ah = chh * dpr, tick = fi >> 2;
  for (let r = 0; r < rows; r++) {
    const shift = glitch && hash(r, tick, 7) < glitch * 0.5 ? Math.round((hash(r, tick, 8) - 0.5) * cols * 0.3) : 0;
    for (let col = 0; col < cols; col++) {
      const sc = col + shift; if (sc < 0 || sc >= cols) continue;
      const o = (r * cols + sc) * 4, R = d[o], G = d[o + 1], B = d[o + 2];
      const n = hash(col, r, tick);
      let L = Math.max(R, G, B) / 255;
      L = Math.pow(L, 0.85) + n * 0.17 - 0.03;
      let lv = Math.floor(L * (LV - 0.01)); if (lv < 1) continue; if (lv >= LV) lv = LV - 1;
      const v = B > G * 1.3 && B > 50 ? 1 : 0;
      ctx.drawImage(atlas, (lv * 2 + (n > 0.5 ? 1 : 0)) * aw, v * ah, aw, ah, col * cw, r * chh, cw, chh);
    }
  }
  if (stamps.length) {
    ctx.font = `600 ${chh * 0.92}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    for (const s of stamps) {
      if (s.r < 0 || s.r >= rows) continue;
      const a = Math.max(0, Math.min(1, s.a * fade));
      for (let i = 0; i < s.text.length; i++) {
        const col = s.c + i; if (col < 0 || col >= cols) continue;
        ctx.fillStyle = '#0a0908'; ctx.fillRect(col * cw, s.r * chh, cw, chh);
        if (s.text[i] === ' ') continue;
        ctx.globalAlpha = a; ctx.fillStyle = s.violet ? '#c4a6ff' : '#f2e6cc';
        ctx.fillText(s.text[i], col * cw + cw / 2, s.r * chh + chh / 2); ctx.globalAlpha = 1;
      }
    }
  }
  caption(c);
}

resize();
addEventListener('resize', resize);
if (document.fonts && document.fonts.load) document.fonts.load(`12px "IBM Plex Mono"`).then(resize).catch(() => {});
requestAnimationFrame(frame);
})();
</script>
