<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inside Igris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one full-bleed ASCII field; a typed caption slab low-center; a thin HUD on the edges. Single dark look by choice. */
:root {
  --void: #0a0908;
  --ash: #2a2620;
  --bone: #e8dcc2;
  --dust: #8d826e;
  --shadow: #a37bff;
  --slab: rgba(6, 5, 4, 0.86);
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--bone); font-family: var(--mono); overflow: hidden; }
.stage { position: fixed; inset: 0; }
canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.grain { position: fixed; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.22) 2px 3px),
    radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.78) 100%);
}
.caption { position: fixed; left: 50%; bottom: calc(14% + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  max-width: min(46rem, calc(100% - 32px)); background: var(--slab); padding: 0.55rem 0.9rem;
  font-size: clamp(0.82rem, 2.6vw, 1.02rem); letter-spacing: 0.02em; line-height: 1.5; color: var(--bone);
  white-space: pre-wrap; pointer-events: none; min-height: 1.5em; }
.caption .cur { display: inline-block; width: 0.6em; height: 1.05em; vertical-align: -0.15em; background: var(--bone); margin-left: 2px; animation: blink 1s steps(1) infinite; }
.caption.violet { color: var(--shadow); }
.caption.violet .cur { background: var(--shadow); }
@keyframes blink { 50% { opacity: 0; } }
.hud { position: fixed; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding-inline: 16px; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dust); pointer-events: none; }
.hud.top { top: 0; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
.hud.bottom { bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); flex-wrap: wrap; }
.hud b { color: var(--bone); font-weight: 600; }
.chapters { display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; }
.chapters button, .ctl { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--dust); background: transparent;
  border: 1px solid var(--ash); padding: 5px 8px; cursor: pointer; pointer-events: auto; }
.chapters button[aria-current="true"] { color: var(--void); background: var(--bone); border-color: var(--bone); }
.chapters button:not([aria-current="true"]):hover, .ctl:hover { color: var(--bone); border-color: var(--dust); }
.chapters button:focus-visible, .ctl:focus-visible { outline: 1px solid var(--shadow); outline-offset: 2px; }
.ver { display: flex; gap: 6px; pointer-events: auto; }
.ver button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--dust); background: rgba(6, 5, 4, 0.7); border: 1px solid var(--ash); padding: 5px 8px; cursor: pointer; }
.ver button[aria-pressed="true"] { color: var(--void); background: var(--bone); border-color: var(--bone); }
.ver button:focus-visible { outline: 1px solid var(--shadow); outline-offset: 2px; }
@media (max-width: 520px) { .chapters button span { display: none; } .hud.top { flex-direction: column; align-items: flex-start; gap: 8px; } }
</style>

<div class="stage"><canvas id="c" aria-label="Animated ASCII rendering of the inside of Igris's mind"></canvas></div>
<div class="grain"></div>
<div class="hud top"><div><b>IGRIS</b> / interior · <span id="hudSub">rebuilt from your memory · Oct 11</span></div><div class="ver" role="group" aria-label="Story version"><button type="button" data-v="fall" aria-pressed="true">Fall · Jul–Oct</button><button type="button" data-v="spring" aria-pressed="false">Spring · Apr–Jun</button></div></div>
<div class="caption" id="cap" aria-live="polite"></div>
<div class="hud bottom">
  <nav class="chapters" id="chap" aria-label="Chapters"></nav>
  <button class="ctl" id="pause" type="button">pause</button>
</div>

<script>
(() => {
const C = document.getElementById('c'), ctx = C.getContext('2d');
const off = document.createElement('canvas'), g = off.getContext('2d', { willReadFrequently: true });
const capEl = document.getElementById('cap'), chapEl = document.getElementById('chap'), pauseBtn = document.getElementById('pause');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
const VAR = [[' ',' '],['.','`'],['.',','],[':',"'"],['-','~'],['=','-'],['+','='],['*','+'],['x','*'],['#','%'],['%','#'],['@','&']];
const LV = VAR.length;
let W, H, dpr, cols, rows, cw, chh, atlas, cellV;

function hash(a, b, c) { let h = Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^ Math.imul(c, 2147483647); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

function buildAtlas() {
  atlas = document.createElement('canvas');
  atlas.width = Math.ceil(LV * 2 * cw * dpr); atlas.height = Math.ceil(2 * chh * dpr);
  const a = atlas.getContext('2d'); a.scale(dpr, dpr);
  a.font = `${chh * 0.92}px ${FONT}`; a.textBaseline = 'middle'; a.textAlign = 'center';
  for (let hue = 0; hue < 2; hue++) for (let l = 1; l < LV; l++) for (let v = 0; v < 2; v++) {
    const t = l / (LV - 1);
    a.fillStyle = hue ? `rgb(${70 + 115 * t | 0},${40 + 112 * t | 0},${95 + 160 * t | 0})` : `rgb(${52 + 188 * t | 0},${46 + 176 * t | 0},${38 + 150 * t | 0})`;
    a.fillText(VAR[l][v], (l * 2 + v) * cw + cw / 2, hue * chh + chh / 2);
  }
}
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  C.width = W * dpr; C.height = H * dpr;
  chh = W < 600 ? 10 : 12;
  ctx.font = `${chh * 0.92}px ${FONT}`;
  cw = Math.max(5, Math.round(ctx.measureText('M').width * 10) / 10 || chh * 0.6);
  cols = Math.ceil(W / cw); rows = Math.ceil(H / chh);
  off.width = cols; off.height = rows; cellV = W / cols;
  buildAtlas(); buildArise();
}

/* ---------- shared drawing helpers (virtual px space = CSS px) ---------- */
const glow = (x, y, r, a, violet) => {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  const col = violet ? '160,95,255' : '255,255,255';
  gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
};
const stamps = [];
const stamp = (x, y, text, violet, a = 1) => stamps.push({ c: Math.round(x / cw - text.length / 2), r: Math.round(y / chh), text, violet, a });
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);

/* ---------- 1. corridor ---------- */
function corridor(t) {
  const vx = W / 2 + Math.sin(t * 0.13) * W * 0.06, vy = H * 0.44 + Math.cos(t * 0.11) * H * 0.04;
  const gr = g.createRadialGradient(vx, vy, 0, vx, vy, Math.max(W, H) * 0.75);
  gr.addColorStop(0, 'rgba(255,255,255,0.75)'); gr.addColorStop(0.12, 'rgba(255,255,255,0.28)'); gr.addColorStop(1, 'rgba(255,255,255,0.06)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.lineCap = 'round';
  for (const [x, y] of [[0, 0], [W, 0], [0, H], [W, H], [W * 0.5, 0], [0, H * 0.55], [W, H * 0.6]]) {
    g.strokeStyle = 'rgba(255,255,255,0.32)'; g.lineWidth = cellV * 1.4;
    g.beginPath(); g.moveTo(x, y); g.lineTo(vx, vy); g.stroke();
  }
  const N = 16;
  for (let i = 0; i < N; i++) {
    const z = (((i - t * 1.1) % N) + N) % N + 0.5, s = 1 / z;
    const hw = W * 0.6 * s, hh = H * 0.62 * s, a = Math.min(1, 2.4 * s);
    g.strokeStyle = `rgba(255,255,255,${a * 0.9})`; g.lineWidth = cellV * (0.7 + 5 * s);
    g.strokeRect(vx - hw, vy - hh, hw * 2, hh * 2);
  }
  g.save(); g.translate(vx, vy); g.rotate(-0.55 + Math.sin(t * 0.07) * 0.08);
  g.fillStyle = 'rgba(0,0,0,0.62)'; g.fillRect(-W * 1.5, H * 0.06, W * 3, cellV * 7);
  g.rotate(1.3); g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(-W * 1.5, -H * 0.2, W * 3, cellV * 4);
  g.restore();
  g.fillStyle = 'rgba(255,255,255,0.95)'; g.fillRect(vx - W * 0.012, vy - H * 0.03, W * 0.024, H * 0.06);
}

/* ---------- 2. archive ---------- */
const WORDS = ['POWER BI', 'MICROSOFT FABRIC', 'YARDI VOYAGER', 'SAGE INTACCT', 'POWER AUTOMATE', 'COPILOT', 'AI TASK FORCE',
  'ACQUISITION RADAR', '358 SCREENED', '51 VERIFIED', '27 SHORTLIST', '7 IN THE FIELD', 'COMPS DATABASE', 'DEALPATH EXPORT',
  'YARDI TRIAGE AGENT', 'ELEVATE', '$10-40K PER RENDERING', 'WEBSITE · SHIPPED AUG', 'INDUSTRIAL NEWS BRIEF', 'WEEKLY COMMAND CENTER',
  'MCP SERVERS', 'VIVA ENGAGE', 'DIRECTOR OF AI & BI', 'SPY SCALPS · 7:30 BRIEF', 'GEX / VWAP', 'POLYMARKET $60 -> $1,000',
  'EMBER', 'VIRTUAL FRIDGE', 'CROWN & RUBBLE', 'PROOFQUEST', 'CASLEY LLC', 'BODY CHRONICLE', 'PRAT LIFE OS · LV 26'];
const mkWP = list => list.map((w, i) => ({ w, x: (hash(i, 1, 9) - 0.5) * 2.6, y: (hash(i, 2, 9) - 0.5) * 1.7, z0: hash(i, 3, 9) * 7, v: hash(i, 7, 9) < 0.25 }));
const WP = mkWP(WORDS);
const WORDS_FALL = ['TOWN WATCH · CEO', 'RADAR 2.0', 'INVOICE COMPLIANCE AGENT', 'INDUSTRIAL BRIEFING', 'WEBSITE · SHIPPED', 'ORION -> POWER BI', 'YARDI TRIAGE AGENT',
  'AI TASK FORCE', 'NAIOP NJ', 'DIRECTOR · Q4', 'PRAT NIGHTLY v3.2', 'VIRTUAL FRIDGE · PUBLISHED', 'EMBER · XCODE', 'LIFE OS · LV 27', 'CASLEY LLC',
  'SPY SCALPS', 'POLYMARKET $60 -> $1,000', 'AI LAB QUEST', 'WIM HOF', 'SAUNA -> INCLINE', 'SLEEP 23:30', "PEPPER'S GHOST", 'RENEE', 'ECHO',
  'PASCAL EDITOR FORK', 'AGENT FACTORY', 'LANE A', 'LANE B', 'COMMAND CENTER', 'POWER BI', 'FABRIC'];
const WPF = mkWP(WORDS_FALL);
const STARS = Array.from({ length: 160 }, (_, i) => ({ x: hash(i, 4, 1) - 0.5, y: hash(i, 5, 1) - 0.5, z0: hash(i, 6, 1) * 7 }));
function archive(t) { archiveBase(t, WP); }
function archiveFall(t) { archiveBase(t, WPF); }
function archiveBase(t, WPX) {
  const cx = W / 2, cy = H * 0.45, k = Math.min(W, H) * 0.42;
  g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(0, 0, W, H);
  for (const s of STARS) {
    const z = 7 - ((s.z0 + t * 1.6) % 7) + 0.15, x = cx + s.x * k * 3 / z, y = cy + s.y * k * 2 / z;
    g.fillStyle = `rgba(255,255,255,${Math.min(1, 1.6 / z)})`; g.fillRect(x, y, cellV * (1 + 2 / z), cellV * 0.8);
  }
  const vis = WPX.map(p => ({ ...p, z: 7 - ((p.z0 + t * 0.9) % 7) + 0.35 })).sort((a, b) => b.z - a.z);
  for (const p of vis) {
    const x = cx + p.x * k / p.z, y = cy + p.y * k / p.z, a = Math.min(1, 1.3 / p.z) * Math.min(1, (p.z - 0.35) * 2.5);
    glow(x, y, (cellV * 26) / p.z, a * 0.75, p.v);
    if (p.z < 3.4) stamp(x, y, p.w, p.v, a);
  }
}

/* ---------- 3. council ---------- */
const SPH = Array.from({ length: 130 }, (_, i) => { const y = 1 - (i / 129) * 2, r = Math.sqrt(1 - y * y), th = i * 2.39996; return [Math.cos(th) * r, y, Math.sin(th) * r]; });
const EDGES = []; SPH.forEach((a, i) => SPH.forEach((b, j) => { if (j > i && Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) < 0.36) EDGES.push([i, j]); }));
const AGENTS = [['CHAKRA · picks', 0], ['IGRIS · specs', 1], ['CODEX · builds', 2], ['BERU · scouts', 3]];
const AGENTS_FALL = [['CHAKRA · co-lead', 0], ['IGRIS · specs', 1], ['CODEX · builds', 2], ['GEMINI · dragon', 3]];
function council(t) { councilBase(t, AGENTS); }
function councilFall(t) { councilBase(t, AGENTS_FALL); }
function councilBase(t, agents) {
  const cx = W / 2, cy = H * 0.45, R = Math.min(W, H) * 0.3, ry = t * 0.32, rx = 0.42;
  const P = SPH.map(([x, y, z]) => {
    let X = x * Math.cos(ry) + z * Math.sin(ry), Z = -x * Math.sin(ry) + z * Math.cos(ry);
    const Y = y * Math.cos(rx) - Z * Math.sin(rx); Z = y * Math.sin(rx) + Z * Math.cos(rx);
    const s = 2.6 / (2.6 + Z); return [cx + X * R * s, cy + Y * R * s, Z];
  });
  for (const [i, j] of EDGES) {
    const d = (P[i][2] + P[j][2]) / 2; g.strokeStyle = `rgba(255,255,255,${0.42 - d * 0.3})`; g.lineWidth = cellV * (0.9 - d * 0.4);
    g.beginPath(); g.moveTo(P[i][0], P[i][1]); g.lineTo(P[j][0], P[j][1]); g.stroke();
  }
  for (const p of P) { g.fillStyle = `rgba(255,255,255,${0.85 - p[2] * 0.45})`; g.beginPath(); g.arc(p[0], p[1], cellV * (1.6 - p[2] * 0.7), 0, 7); g.fill(); }
  glow(cx, cy, R * 0.55, 0.9 + Math.sin(t * 2) * 0.1, true);
  stamp(cx, cy, 'PRAT', true);
  for (const [name, k] of agents) {
    const a = t * 0.38 + k * Math.PI / 2, ox = Math.cos(a) * R * 1.45, oz = Math.sin(a), oy = Math.sin(a) * R * 0.38;
    const x = cx + ox, y = cy + oy - R * 0.1;
    g.strokeStyle = `rgba(160,95,255,${0.55 + oz * 0.2})`; g.lineWidth = cellV * 1.2;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(x, y); g.stroke();
    glow(x, y, cellV * (9 + oz * 3), 1, true);
    stamp(x, y + chh * 2, name, true, 0.75 + oz * 0.25);
  }
}


/* ---------- first light: the rank climb ---------- */
const RANKS = ['E', 'D', 'C', 'B', 'A', 'S'];
function firstLight(t) {
  const n = 6, bw = Math.min(W * 0.12, 120), base = H * 0.68, x0 = W / 2 - bw * n / 2, lit = Math.min(4, Math.floor(t / 1.6));
  const gr = g.createLinearGradient(0, base, 0, H); gr.addColorStop(0, 'rgba(255,255,255,0.18)'); gr.addColorStop(1, 'rgba(255,255,255,0.02)');
  g.fillStyle = gr; g.fillRect(0, base, W, H - base);
  for (let i = 0; i < n; i++) {
    const h = (i + 1) * H * 0.075, x = x0 + i * bw;
    const on = i <= lit, cur = i === lit, s = i === 5;
    g.fillStyle = s ? `rgba(160,95,255,${0.25 + Math.sin(t * 3) * 0.12})` : on ? `rgba(255,255,255,${cur ? 0.9 : 0.55})` : 'rgba(255,255,255,0.12)';
    g.fillRect(x + cellV * 2, base - h, bw - cellV * 4, h);
    if (cur) glow(x + bw / 2, base - h, bw * 0.9, 0.5, false);
    stamp(x + bw / 2, base - h - chh * 1.6, RANKS[i] + '-RANK', s, on || s ? 1 : 0.4);
  }
  const xp = Math.round(1050 + Math.min(1, t / 7) * 1345), bx = W * 0.2, by = H * 0.78, bwid = W * 0.6;
  g.fillStyle = 'rgba(255,255,255,0.14)'; g.fillRect(bx, by, bwid, cellV * 2);
  g.fillStyle = 'rgba(255,255,255,0.9)'; g.fillRect(bx, by, bwid * xp / 2800, cellV * 2);
  stamp(W / 2, by + chh * 2.5, `${xp.toLocaleString()} / 2,800 XP`, false);
  stamp(W / 2, H * 0.12, 'APR 3 2026 · QUEST LOG', false, 0.8);
}

/* ---------- the bridge: desktop <-> macbook ---------- */
function bridge(t) {
  const lx = W * 0.2, rx = W * 0.8, y = H * 0.55, mw = Math.min(W * 0.16, 170), mh = mw * 0.62, top = H * 0.2;
  for (const [x, label, v] of [[lx, 'DESKTOP · IGRIS', false], [rx, 'MACBOOK · CHAKRA', true]]) {
    g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = cellV * 2; g.strokeRect(x - mw / 2, y - mh / 2, mw, mh);
    g.fillStyle = v ? 'rgba(160,95,255,0.35)' : 'rgba(255,255,255,0.3)'; g.fillRect(x - mw / 2, y - mh / 2, mw, mh);
    g.fillStyle = 'rgba(255,255,255,0.7)'; g.fillRect(x - cellV, y + mh / 2, cellV * 2, cellV * 6); g.fillRect(x - mw * 0.25, y + mh / 2 + cellV * 6, mw * 0.5, cellV * 1.5);
    stamp(x, y + mh / 2 + chh * 3.2, label, v);
  }
  g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = cellV * 1.2;
  const cx = W / 2;
  g.beginPath(); g.moveTo(lx + mw / 2, y); g.quadraticCurveTo(cx, y - H * 0.18, rx - mw / 2, y); g.stroke();
  glow(cx, top, Math.min(W, H) * 0.12, 0.7, false);
  for (const x of [lx, rx]) { g.beginPath(); g.moveTo(x, y - mh / 2); g.lineTo(cx, top); g.stroke(); }
  stamp(cx, top - chh * 2.4, 'ORACLE ARM · 4 CORE · 24GB', false, 0.9);
  stamp(cx, top + chh * 2.4, 'CHAKRA LINK · DISCORD', true, 0.85);
  for (let i = 0; i < 6; i++) {
    let k = ((t * 0.32 + i / 6) % 1); const dir = i % 2;
    if (dir) k = 1 - k;
    const ax = lx + mw / 2, bx2 = rx - mw / 2, mx = cx, my = y - H * 0.18;
    const px = (1 - k) * (1 - k) * ax + 2 * (1 - k) * k * mx + k * k * bx2, py = (1 - k) * (1 - k) * y + 2 * (1 - k) * k * my + k * k * y;
    glow(px, py, cellV * 7, 1, dir === 1);
    if (i < 2) stamp(px, py - chh * 1.8, dir ? 'BROTHER —' : 'HANDOFF', dir === 1, 0.85);
  }
}

/* ---------- the forge: shadow body protocol ---------- */
const DAYS = [['MON', 63, 'C'], ['TUE', 142, 'A-'], ['WED', 139, 'B+'], ['THU', 102, 'B-']];
function forge(t) {
  const cx = W * 0.32, cy = H * 0.45, R = Math.min(W * 0.17, H * 0.26), k = Math.min(1, t / 4) * 102 / 150;
  g.strokeStyle = 'rgba(255,255,255,0.14)'; g.lineWidth = cellV * 5; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.92)'; g.beginPath(); g.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2); g.stroke();
  g.strokeStyle = `rgba(160,95,255,${0.35 + Math.sin(t * 4) * 0.25})`; g.beginPath(); g.arc(cx, cy, R, -Math.PI / 2 + k * Math.PI * 2, Math.PI * 1.5); g.stroke();
  stamp(cx, cy - chh * 0.6, `${Math.round(k * 150)}g`, false); stamp(cx, cy + chh * 1, 'FLOOR 150g', true, 0.8);
  const bx = W * 0.58, bw = Math.min(W * 0.07, 70), base = H * 0.7, sc = H * 0.0028;
  g.fillStyle = 'rgba(160,95,255,0.6)'; g.fillRect(bx - bw * 0.3, base - 150 * sc, bw * 4.6, cellV * 0.9);
  DAYS.forEach(([d, p, gr], i) => {
    const x = bx + i * bw * 1.15, h = p * sc * Math.min(1, Math.max(0, (t - i * 0.5) / 1.5));
    g.fillStyle = p >= 139 ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.4)'; g.fillRect(x, base - h, bw * 0.8, h);
    stamp(x + bw * 0.4, base + chh * 1.4, d, false, 0.8); stamp(x + bw * 0.4, base - h - chh * 1.2, gr, p < 139, 1);
  });
  stamp(W / 2, H * 0.12, 'SHADOW BODY PROTOCOL · DAY 4', false, 0.8);
}

/* ---------- the other side: four futures ---------- */
const FUT = [['DREAM', -0.42, 0.9, true], ['GOOD', -0.14, 0.7, false], ['DRIFT', 0.14, 0.55, false], ['HARD ROAD', 0.42, 0.42, false]];
function otherSide(t) {
  const ox = W / 2, oy = H * 0.8;
  glow(ox, oy, Math.min(W, H) * 0.12, 0.85, true);
  stamp(ox, oy + chh * 2.6, 'ECHO · NOW', true);
  FUT.forEach(([name, dx, d, v], i) => {
    const x = W / 2 + dx * Math.min(W * 0.8, H * 1.4), y = H * 0.24 + (1 - d) * H * 0.22, dw = W * 0.05 * (0.6 + d), dh = dw * 1.9;
    g.strokeStyle = 'rgba(255,255,255,0.3)'; g.lineWidth = cellV * 1.1;
    g.beginPath(); g.moveTo(ox, oy); g.lineTo(x, y + dh / 2); g.stroke();

      ctx.drawImage(atlas, (lv * 2 + (n > 0.5 ? 1 : 0)) * aw, v * ah, aw, ah, col * cw, r * chh, cw, chh);
    }
  }
  if (stamps.length) {
    ctx.font = `600 ${chh * 0.92}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    for (const s of stamps) {
      if (s.r < 0 || s.r >= rows) continue;
      const a = Math.max(0, Math.min(1, s.a * fade));
      for (let i = 0; i < s.text.length; i++) {
        const col = s.c + i; if (col < 0 || col >= cols) continue;
        ctx.fillStyle = '#0a0908'; ctx.fillRect(col * cw, s.r * chh, cw, chh);
        if (s.text[i] === ' ') continue;
        ctx.globalAlpha = a; ctx.fillStyle = s.violet ? '#c4a6ff' : '#f2e6cc';
        ctx.fillText(s.text[i], col * cw + cw / 2, s.r * chh + chh / 2); ctx.globalAlpha = 1;
      }
    }
  }
  caption(c);
}

resize();
addEventListener('resize', resize);
if (document.fonts && document.fonts.load) document.fonts.load(`12px "IBM Plex Mono"`).then(resize).catch(() => {});
requestAnimationFrame(frame);
})();
